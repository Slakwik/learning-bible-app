name: Android device check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Give the diagnostic copy its own package and label
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android.buildTypes.debug.applicationIdSuffix = '.diagnostic'
          android.defaultConfig.versionName = '0.2.1-diagnostic'
          GRADLE
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          source = path.read_text()
          source = source.replace('android:label="Изучение Библии"', 'android:label="Библия · Проверка"')
          path.write_text(source)
          PY
      - name: Build diagnostic APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bible-learning-device-check-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
