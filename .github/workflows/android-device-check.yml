name: Android device check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore persistent preview signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Configure ANDROID_PREVIEW_KEYSTORE_BASE64 before publishing preview APKs."
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Give the diagnostic copy its own package and label
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android.buildTypes.debug.applicationIdSuffix = '.classpreview'
          GRADLE
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          source = path.read_text()
          source = source.replace('android:label="Изучение Библии"', 'android:label="Библия · Класс"')
          path.write_text(source)
          PY
      - name: Build diagnostic APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bible-learning-device-check-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
